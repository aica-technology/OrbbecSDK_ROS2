schema: 1-0-2
name: Orbbec Camera
description:
  brief: Stream color and depth images from an Orbbec camera
  details:
    This component launches a camera node, that allows streaming of color and depth images from an Orbbec camera. Please
    check your camera's documentation for the available resolutions, formats and frame rates. The provided parameters
    allow to activate several different filters, which in turn allow and may -optionally- require the definition of
    their own dedicated parameters. For more information on what should be defined, please check the individual filter
    descriptions.
inherits: rclcpp::Node
class: orbbec_camera::OBCameraNodeDriver
type: component
parameters:
  - display_name: Camera Name
    description: Name of the camera, used to set the frame names
    parameter_name: camera_name
    parameter_type: string
    default_value: orbbec_camera
  - display_name: Serial Number
    description: Serial number of the camera, required when using multiple cameras
    parameter_name: serial_number
    parameter_type: string
    default_value: null
    optional: true
  - display_name: USB Port
    description: USB port of the camera, required when using multiple cameras
    parameter_name: usb_port
    parameter_type: string
    default_value: null
    optional: true
  - display_name: Number of Devices
    description: Number of devices, required when using multiple cameras
    parameter_name: device_num
    parameter_type: int
    default_value: 1
  - display_name: Color Width
    description: Width of the color image. Check the camera's documentation for the available resolution profiles.
    parameter_name: color_width
    parameter_type: int
    default_value: null
    optional: true
  - display_name: Color Height
    description: Height of the color image. Check the camera's documentation for the available resolution profiles.
    parameter_name: color_height
    parameter_type: int
    default_value: null
    optional: true
  - display_name: Color FPS
    description: Frames per second of the color stream. Check the camera's documentation for the available frame rates.
    parameter_name: color_fps
    parameter_type: int
    default_value: null
    optional: true
  - display_name: Color Format
    description: Format of the color image
    parameter_name: color_format
    parameter_type: string
    default_value: MJPG
    validation:
      options:
        - MJPG,
          MJPEG,
          YUYV,
          YUYV2,
          UYVY,
          NV12,
          NV21,
          H264,
          H265,
          GRAY,
          HEVC,
          I420,
          RGB888,
          RGB,
          BGR,
          BGRA,
          YV12,
          RGBA
    internal: true
  - display_name: Depth Width
    description: Width of the depth image. Check the camera's documentation for the available resolution profiles.
    parameter_name: depth_width
    parameter_type: int
    default_value: null
    optional: true
  - display_name: Depth Height
    description: Height of the depth image. Check the camera's documentation for the available resolution profiles.
    parameter_name: depth_height
    parameter_type: int
    default_value: null
    optional: true
  - display_name: Depth FPS
    description: Frames per second of the depth stream. Check the camera's documentation for the available frame rates.
    parameter_name: depth_fps
    parameter_type: int
    default_value: null
    optional: true
  - display_name: Depth Format
    description: Format of the depth image
    parameter_name: depth_format
    parameter_type: string
    default_value: Y16
    validation:
      options:
        - Y16
        - Y8
        - Y10
        - Y11
        - Y12
        - REL
        - Y14
        - RVL
        - Z16
        - RW16
        - Y12C4
    internal: true
  - display_name: Enable Alignment
    description: Enable the alignment of the color and depth image
    parameter_name: depth_registration
    parameter_type: bool
    default_value: false
  - display_name: Alignment Mode
    description: Alignment mode for color and depth image
    parameter_name: align_mode
    parameter_type: string
    default_value: HW
    validation:
      options:
        - HW
        - SW
  - display_name: Alignment Target Stream
    description: Target stream to align with (COLOR or DEPTH)
    parameter_name: align_target_stream
    parameter_type: string
    default_value: COLOR
    internal: true
    validation:
      options:
        - COLOR
        - DEPTH
  - display_name: Enable Threshold Filter
    description: Enable the depth threshold filter (if enabled, set threshold_filter_max and threshold_filter_min)
    parameter_name: enable_threshold_filter
    parameter_type: bool
    default_value: false
  - display_name: Threshold Filter Max
    description:
      Max value of the threshold filter [mm]. A value below the minimum Z depth (check the camera's documentation for
      more details) will result in an empty image.
    parameter_name: threshold_filter_max
    parameter_type: int
    default_value: null
    optional: true
    internal: true
    validation:
      range:
        minimum: 0
        maximum: 16000
  - display_name: Threshold Filter Min
    description: Min value of the threshold filter [mm]
    parameter_name: threshold_filter_min
    parameter_type: int
    default_value: null
    optional: true
    internal: true
    validation:
      range:
        minimum: 0
        maximum: 16000
  - display_name: Enable Temporal Filter
    description:
      Enable the depth temporal filter (if enabled, set temporal_filter_diff_threshold and temporal_filter_weight)
    parameter_name: enable_temporal_filter
    parameter_type: bool
    default_value: false
  - display_name: Temporal Filter Weight
    description: Weight for the current frame value
    parameter_name: temporal_filter_weight
    parameter_type: double
    default_value: null
    optional: true
    internal: true
    validation:
      range:
        minimum: 0.1
        maximum: 1
  - display_name: Temporal Filter Diff Threshold
    description: Threshold for the non-motion noise
    parameter_name: temporal_filter_diff_threshold
    parameter_type: double
    default_value: null
    optional: true
    internal: true
    validation:
      range:
        minimum: 0.1
        maximum: 1
  - display_name: Enable Noise Removal Filter
    description:
      Enable the depth noise removal filter (if enabled, set noise_removal_filter_min_diff and
      noise_removal_filter_max_size)
    parameter_name: enable_noise_removal_filter
    parameter_type: bool
    default_value: false
  - display_name: Noise Removal Filter Min Diff
    description: Minimum depth difference
    parameter_name: noise_removal_filter_min_diff
    parameter_type: int
    default_value: null
    optional: true
    internal: true
    validation:
      range:
        minimum: 1
        maximum: 10000
  - display_name: Noise Removal Filter Max Size
    description: Maximum size of noise cluster
    parameter_name: noise_removal_filter_max_size
    parameter_type: int
    default_value: null
    optional: true
    internal: true
    validation:
      range:
        minimum: 1
        maximum: 10000
  - display_name: Enable Spatial Filter
    description:
      Enable the depth spatial filter (if enabled, set spatial_filter_alpha, spatial_filter_diff_threshold,
      spatial_filter_magnitude, spatial_filter_radius)
    parameter_name: enable_spatial_filter
    parameter_type: bool
    default_value: false
  - display_name: Spatial Filter Alpha
    description: Weight for the current pixel value
    parameter_name: spatial_filter_alpha
    parameter_type: double
    default_value: null
    optional: true
    internal: true
    validation:
      range:
        minimum: 0.1
        maximum: 1
  - display_name: Spatial Filter Diff Threshold
    description: Threshold for non-edge transitions
    parameter_name: spatial_filter_diff_threshold
    parameter_type: int
    default_value: null
    optional: true
    internal: true
    validation:
      range:
        minimum: 1
        maximum: 10000
  - display_name: Spatial Filter Magnitude
    description: Number of filtering iterations
    parameter_name: spatial_filter_magnitude
    parameter_type: int
    default_value: null
    optional: true
    internal: true
    validation:
      range:
        minimum: 1
        maximum: 5
  - display_name: Spatial Filter Radius
    description: Maximum radius of holes in depth image to be filled [pixel(s)]
    parameter_name: spatial_filter_radius
    parameter_type: int
    default_value: null
    optional: true
    internal: true
    validation:
      range:
        minimum: 0
        maximum: 8
  - display_name: Enable Hole Filling Filter
    description: Enable the hole filling filter (if enabled, optionally set the hole_filling_filter_mode)
    parameter_name: enable_hole_filling_filter
    parameter_type: bool
    default_value: false
  - display_name: Hole Filling Filter Mode
    description: Mode for the hole filling filter
    parameter_name: hole_filling_filter_mode
    parameter_type: string
    default_value: null
    internal: true
    optional: true
    validation:
      options:
        - FILL
        - TOP
        - FILL_NEAREST
        - FILL_FAREST
  - display_name: Publish TFs
    description: Publish TFs from camera extrinsics
    parameter_name: publish_tf
    parameter_type: bool
    default_value: true
    internal: true
  - display_name: Enable Left IR
    description: Enable the left infrared camera
    parameter_name: enable_left_ir
    parameter_type: bool
    default_value: false
  - display_name: Enable Right IR
    description: Enable the right infrared camera
    parameter_name: enable_right_ir
    parameter_type: bool
    default_value: false
  - display_name: Enable IR
    description: Enable the infrared camera
    parameter_name: enable_ir
    parameter_type: bool
    default_value: false
  - display_name: Left IR Format
    description: Format of the left infrared image
    parameter_name: left_ir_format
    parameter_type: string
    default_value: Y16
    internal: true
    validation:
      options:
        - Y16
        - Y8
        - Y10
        - Y11
        - Y12
        - REL
        - Y14
        - RVL
        - Z16
        - RW16
        - Y12C4
  - display_name: Right IR Format
    description: Format of the right infrared image
    parameter_name: right_ir_format
    parameter_type: string
    default_value: Y16
    internal: true
    validation:
      options:
        - Y16
        - Y8
        - Y10
        - Y11
        - Y12
        - REL
        - Y14
        - RVL
        - Z16
        - RW16
        - Y12C4
  - display_name: IR Format
    description: Format of the infrared image
    parameter_name: ir_format
    parameter_type: string
    default_value: Y16
    internal: true
    validation:
      options:
        - Y16
        - Y8
        - Y10
        - Y11
        - Y12
        - REL
        - Y14
        - RVL
        - Z16
        - RW16
        - Y12C4
outputs:
  - display_name: Color Image
    description: Raw color image stream
    signal_name: color_image
    signal_type: external
    external_signal_type: sensor_msgs::msg::Image
  - display_name: Color Camera Info
    description: Color camera intrinsics
    signal_name: color_camera_info
    signal_type: external
    external_signal_type: sensor_msgs::msg::CameraInfo
  - display_name: Depth Image
    description: Depth image stream, which is aligned with the color image if enabled
    signal_name: depth_image
    signal_type: external
    external_signal_type: sensor_msgs::msg::Image
  - display_name: Depth Camera Info
    description: Depth camera intrinsics
    signal_name: depth_camera_info
    signal_type: external
    external_signal_type: sensor_msgs::msg::CameraInfo
  - display_name: Left IR Image
    description: Left infrared image stream
    signal_name: left_ir_image
    signal_type: external
    external_signal_type: sensor_msgs::msg::Image
  - display_name: Left IR Camera Info
    description: Left infrared camera intrinsics
    signal_name: left_ir_camera_info
    signal_type: external
    external_signal_type: sensor_msgs::msg::CameraInfo
  - display_name: Right IR Image
    description: Right infrared image stream
    signal_name: right_ir_image
    signal_type: external
    external_signal_type: sensor_msgs::msg::Image
  - display_name: Right IR Camera Info
    description: Right infrared camera intrinsics
    signal_name: right_ir_camera_info
    signal_type: external
    external_signal_type: sensor_msgs::msg::CameraInfo
  - display_name: IR Image
    description: Infrared image stream
    signal_name: ir_image
    signal_type: external
    external_signal_type: sensor_msgs::msg::Image
  - display_name: IR Camera Info
    description: Infrared camera intrinsics
    signal_name: ir_camera_info
    signal_type: external
    external_signal_type: sensor_msgs::msg::CameraInfo
